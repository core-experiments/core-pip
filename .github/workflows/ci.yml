name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * MON"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src/

  tests:
    name: tests / ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            python: "3.10"
          - os: ubuntu
            python: "3.14"
          # Temporarily disabled while the macOS runner issue is investigated.
          # - os: macos
          #   python: "3.10"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install VCS test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes brz mercurial subversion
      - name: Install VCS test dependencies
        if: runner.os == 'macOS'
        run: brew install breezy mercurial subversion
      - run: uv sync --locked --all-groups
      - name: Run full test suite
        run: >-
          uv run pytest tests/ -n auto
          --cov=cpip.install.wheel_transaction
          --cov=cpip.install.wheel_archive
          --cov=cpip.install.wheel_scripts
          --cov=cpip.install.wheel_state
          --cov=cpip.resolution.resolver
          --cov=cpip.resolution.resolver_internals.conflicts
          --cov=cpip.resolution.resolver_internals.search
          --cov=cpip.resolution.resolver_internals.selection
          --cov-report=term-missing
          --cov-fail-under=70

  packaging:
    name: packaging / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [ubuntu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build

  check:
    name: check
    if: always()
    needs: [quality, tests, packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
