name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      quick:
        description: Run the short ASV suite
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * MON"

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: true

jobs:
  asv:
    name: ASV / Python 3.12
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Hyperfine
        run: brew install hyperfine
      - run: uv sync --locked --group benchmark
      - name: Run ASV benchmarks
        run: >-
          uv run --group benchmark asv
          --config benchmarks/asv.conf.json run
          ${{ (github.event_name == 'workflow_dispatch' && inputs.quick) && '--quick' || '' }}
      - name: Run deterministic pip versus uv comparisons
        run: >-
          uv run --group benchmark python -m benchmarks.cross_tool
          --scenario trio
          --benchmark resolve-cold
          --benchmark resolve-warm
          --benchmark install-cold
          --benchmark install-warm
          --output-dir benchmarks/results
      - name: Upload ASV results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asv-results
          path: benchmarks/.asv/results/
          if-no-files-found: ignore
      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-tool-results
          path: benchmarks/results/
          if-no-files-found: ignore
