[project]
name = "cpip"
version = "0.0.1"
description = "Pip Reimagined for Performance"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
authors = [
    { name = "turcioskevinr@gmail.com", email = "turcioskevinr@gmail.com" },
]

# NOTE: requires-python is duplicated in __cpip-runner__.py.
# When changing this value, please change the other copy as well.
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cpip = "cpip.cli.entrypoint:main"

[project.urls]
Homepage = "https://cpip.pypa.io/"
Documentation = "https://cpip.pypa.io"
Source = "https://github.com/pypa/cpip"

[build-system]
requires = []
build-backend = "cpip.build.build_backend"
backend-path = ["src"]

[dependency-groups]
benchmark = ["pytest-codspeed>=5.0.3", "tomli>=2", "uv==0.12.1"]
typing = ["ruff", "ty"]
test = [
    "cryptography",
    "filelock",
    "installer",
    "keyring",
    "msgpack",
    "packaging",
    "proxy.py",
    "pyproject-hooks",
    "pytest",
    "pytest-cov",
    "pytest-rerunfailures",
    "pytest-subket",
    "pytest-xdist>=3.8.0",
    "scripttest",
    "tomli-w",
    "tomli",
    "uv",
    "uv-build",
    "virtualenv",
    "werkzeug",
]

[tool.uv]
default-groups = ["typing"]

[tool.uv.build-backend]
module-name = "cpip"

[tool.ruff]
extend-exclude = ["tests/cli/data", "src/cpip/_vendor"]

[tool.pytest.ini_options]
markers = [
    "bzr: tests requiring Bazaar",
    "enable_socket: allow network access for this test",
    "git: tests requiring Git",
    "incompatible_with_venv: tests incompatible with the venv test mode",
    "integration: integration test",
    "mercurial: tests requiring Mercurial",
    "network: test requiring network access",
    "search: cpip search test",
    "svn: tests requiring Subversion",
    "unit: unit test",
]

[tool.ty.src]
exclude = ["src/cpip/_vendor/**"]

[tool.ty.environment]
python-version = "3.14"

[tool.cpip.architecture]
domains = [
    "core",
    "platform",
    "network",
    "build",
    "index",
    "resolution",
    "install",
    "vcs",
    "cli",
]

[tool.cpip.architecture.dependencies]
core = []
platform = ["core"]
build = ["core", "platform"]
index = ["core", "build", "platform"]
network = ["core", "platform", "build", "index"]
vcs = ["core"]
resolution = ["core", "index", "network", "vcs"]
install = ["core", "platform", "network", "build", "index", "resolution", "vcs"]
cli = [
    "core",
    "platform",
    "network",
    "build",
    "index",
    "resolution",
    "install",
    "vcs",
]
